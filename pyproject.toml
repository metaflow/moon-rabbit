[project]
name = "moon-rabbit"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncio-throttle",  # request throttling
    "cachetools",  # caching
    "dacite",  # init class from dict
    "discord",  # discord api
    "dawg-python", # dependency for pymorphy3
    "jinja2",  # templating
    "lark",  # language parsing
    "llist",  # linked list for non-unified diffs
    "pillow",  # image manipulations
    "psycopg2-binary",  # postgres
    "pymorphy3",  # auto-generation of russian morphems (maintained fork of pymorphy2)
    "pymorphy3-dicts-ru",  # russian dictionary for pymorphy3
    "python-dotenv",
    "requests",
    "setuptools",  # required by pymorphy3 (pkg_resources)
    "ttldict2",  # caching
    "twitchio",  # twitch chat + events
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "deptry",
    "types-requests",
    "ty",
]

# Fix for the websocket leak (https://github.com/PythonistaGuild/TwitchIO/issues/548) is on main (3.3.4)
# but not on PyPI yet. Once 3.3.4+ is released, delete this section and run `uv lock --upgrade-package twitchio`.
[tool.uv.sources]
twitchio = { git = "https://github.com/PythonistaGuild/TwitchIO.git", rev = "1db6da4d9bcf501e44fde5a664bfaf3d7c2f116f" }

[tool.deptry.per_rule_ignores]
DEP002 = ["cachetools", "pymorphy3-dicts-ru", "setuptools", "dawg-python"]

[tool.deptry.package_module_name_map]
pillow = "PIL"
psycopg2-binary = "psycopg2"
python-dotenv = "dotenv"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:twitchio",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit baseline = ruff's pre-0.17 default rule set. ruff 0.17 widened its defaults a lot
# (~150 new findings); pin the old set so upgrades don't change lint behaviour silently.
select = ["E4", "E7", "E9", "F"]
extend-select = ["UP", "I", "C4", "SIM"]
# F403: 'from module import *' used; unable to detect undefined names
# F405: Name may be undefined, or defined from star imports
# E402: Module level import not at top of file
# ignore = ["F403", "F405", "E402"]
